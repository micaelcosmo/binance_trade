meta:
  name: "Binance Trade Bot Pro — AI Edition"
  repo_root: "D:\\binance_trade"            # ADR-0012
  version: "v3.7.0"                         # git describe --tags (HEAD)
  branch: "check_strategies"
  main_branch: "main"
  updated_at: "2026-11-11"
  language: "Python 3.13 (Docker: python:3.13-slim)"
  doc_language: "pt-BR"

system_context:
  summary: >
    Terminal de trading algorítmico para swing trade curto de cripto (spot) na
    Binance. Decisão em duas camadas: Porteiro matemático (determinístico,
    barato) filtra; Comitê de IA (Gemini, probabilístico, caro) só decide sobre
    o que passou. Operador (Micael) supervisiona por painel web em tempo real e
    pode intervir (venda forçada, cooldown, desvio Bollinger, +1 trade, update).
  actors:
    operador: "Micael — único usuário; usa o painel web (app.py)"
    agentes_dev: "agentes de IA de desenvolvimento coordenados por orquestrador (ADR-0010)"
  external: [binance_rest, gemini]          # ver external_services
  capital: "REAL (spot). Testes/simulação somente com mock (ADR-0013)"
  topology: |
    Navegador ──socket.io──► app.py (Flask+SocketIO :5000)
                               │ cria *.flag          ▲ lê bot_status.json (poll 1s)
                               ▼                      │
                    [ raiz do repo: *.flag, bot_status.json, *_state.json ]
                               │ consome+apaga flags  ▲ escreve estado (atômico)
                               ▼                      │
           subprocess: python -m binance_trade_bot (motor, SafeScheduler)
                               ├── profit_gain Strategy.scout() a cada scout_sleep_time
                               ├── get_enriched_data() → pandas-ta (4h/1h/15m)
                               ├── scan_market() → Porteiro + orquestração
                               ├── MarketAnalyzer (Gemini 2.5 Flash) + normalize_verdict
                               └── execute_real_trade() → ordem MARKET (python-binance)

runtime:
  processes:
    - id: web
      cmd: "python app.py"
      bind: "0.0.0.0:5000"                  # hardcoded; ver known_issues SEC-01
      threads: [monitor_bot_status (1s), update_stats_loop (15s), read_process_output]
      debug: "APP_DEBUG env (default '1' local; '0' no Docker)"
      owns: [gui_state.json]
    - id: motor
      cmd: "python -m binance_trade_bot"
      spawned_by: "app.py handle_start (subprocess.Popen, cwd=BASE_DIR, PYTHONIOENCODING=utf-8)"
      stdout: "capturado por app.py → evento socket new_log"
      scheduler:
        - "every SCOUT_SLEEP_TIME s (default 60) → trader.scout()"
        - "every 1 min → trader.update_values()"
        - "every 1 min → db.prune_scout_history()"
        - "every 1 h  → db.prune_value_history()"
      notes:
        - "profit_gain: BinanceStreamManager substituído por FakeStreamManager (sem websocket) — crypto_trading.py"
        - "Database SQLAlchemy ainda é criado/migrado no boot (legado; profit_gain persiste em JSON)"
      stop: "app.py handle_stop → bot_process.kill()"
    - id: devpanel
      cmd: ".venv/Scripts/python devpanel/server.py [--port 5055]"
      bind: "127.0.0.1:5055"
      scope: "somente desenvolvimento; não faz parte do produto"
    - id: api_server_legado
      cmd: "binance_trade_bot/api_server.py (porta 5123, debug=True)"
      status: legado   # upstream; não usado pelo fluxo profit_gain/app.py
  config:
    file: "user.cfg (seção [binance_user_config]) — NUNCA lido por agentes (ADR-0003); template: user.cfg.exemple"
    precedence: "env var (NOME.upper()) > user.cfg > default"
    keys:
      api_key / api_secret_key: "env API_KEY / API_SECRET_KEY"
      GOOGLE_API_KEY: "lido por models/ai_agent.py (env GOOGLE_API_KEY > user.cfg), fora do config.py"
      bridge: {default: USDT, env: BRIDGE_SYMBOL}
      strategy: {default: profit_gain}
      scout_sleep_time: {default: 60}
      testnet: {default: false}
      tld: {default: com}
      daily_profit_target_pct: {default: 5.0}
      max_daily_trades: {default: 3}
      base_stop_loss_pct: {default: 7.0}
      disaster_stop_pct: {default: 15.0}
      trailing_activation_pct: {default: 1.5}
      trailing_drop_pct: {default: 0.3}
      ai_cooldown_minutes: {default: 45.0, uso: "intervalo do Tribunal de Swap e cooldown pós-compra"}
      legado: [scout_multiplier, scout_margin, hourToKeepScoutHistory, sell_timeout, buy_timeout, use_margin, current_coin]
    coin_list: "env SUPPORTED_COIN_LIST (espaço) > supported_coin_list.txt > supported_coin_list (gitignored; template supported_coin_list.exemple)"
    env_vars_app: {APP_DEBUG: "1|0", TZ: "fuso do reset diário (compose: America/Fortaleza)"}

